name: App de Android (APK)

# Cada vez que subes cambios a main, GitHub compila la app de Android gratis
# y la publica en la sección «Releases» del repositorio, lista para descargar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Copiar la web dentro de la app
        run: npm run android:sync

      - name: Compilar el APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../xdndandas.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: xdndandas-apk
          path: xdndandas.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: xdndandas 1.0.${{ github.run_number }}
          body: |
            APK de Android. Descárgalo desde el móvil y ábrelo para instalarlo.
            Si Android lo pide, permite «instalar apps de origen desconocido» para tu navegador.
          files: xdndandas.apk
